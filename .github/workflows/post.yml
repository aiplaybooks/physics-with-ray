name: post
on:
  schedule:
    - cron: "*/30 * * * *"   # her 30 dk bak: config/strategy.json'daki bir slot vakti geldiyse sıradaki videoyu yayınla
  workflow_dispatch:
    inputs:
      dry_run: {type: boolean, default: true, description: "yayınlamadan ne yapacağını yaz"}
      force: {type: boolean, default: false, description: "slot beklemeden sıradakini şimdi yayınla"}
      only: {type: string, default: "", description: "ig|fb (boş = hepsi)"}
      item: {type: string, default: "", description: "kuyruktaki belirli video id (boş = sıradaki)"}
concurrency: {group: state, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt
      - name: run
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
            if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
            if [ -n "${{ inputs.item }}" ]; then ARGS="$ARGS --item ${{ inputs.item }}"; fi
          fi
          python src/run.py $ARGS
      - name: commit state
        if: always()
        run: |
          git config user.name "ray-bot" && git config user.email "bot@users.noreply.github.com"
          git add queue state; git diff --cached --quiet || { git commit -qm "state: post"; for n in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep $((n*5)); done; }
