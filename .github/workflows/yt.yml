name: yt
on:
  schedule:
    - cron: "*/30 * * * *"   # her 30 dk: bekleyen videoları YouTube'a yükle/zamanla, yayına girenlere ilk yorumu at
  workflow_dispatch:
    inputs:
      dry_run: {type: boolean, default: false, description: "yüklemeden/yorum atmadan planı yaz"}
concurrency: {group: state, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  yt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt
      - name: yt_schedule
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry"; fi
          python tools/yt_schedule.py $ARGS
      - name: commit state
        if: always()
        run: |
          git config user.name "ray-bot" && git config user.email "bot@users.noreply.github.com"
          git add queue state; (git diff --cached --quiet || (git commit -qm "state: yt" && git pull -q --rebase && git push -q))
